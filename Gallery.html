<body class="blog-page">

    <!-- Ebook Style -->
     <style>
        .photo-grid, .matter-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-top: 34px;
        }

        .photo-grid img{
            height: 300px!important;
            margin: 0 auto;
        }

        .glass-panel{
                
        }

        .ebook-section{
            margin-left: 10px;
            margin-right: 10px;
            margin-top:5%;
            padding: 10px;
        }

        .ebook-section h2{
            font-size: 20px;
        }

        .ebook-card{
        background:#171717;
        border:1px solid ghostwhite;
        border-radius:15px;
        margin-bottom:20px;
        overflow:hidden;
        box-shadow:0 10px 30px rgba(0,0,0,.35);
    }

    .ebook-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:20px 25px;
        cursor:pointer;
    }

    .ebook-header h3{
        color:#fff;
        margin:0;
    }

    .ebook-header small{
        color:#caa55a;
    }

    .expand-btn{
        background:#caa55a;
        color:#000;
        border:none;
        padding:10px 18px;
        border-radius:8px;
        font-weight:600;
        cursor:pointer;
    }

    .ebook-list{

        display:none;

        padding:20px;

        border-top:1px solid rgba(255,255,255,.08);

    }

    .ebook-list.show{
        display:block;
    }

    .ebook-list a{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:14px 18px;
        margin-bottom:12px;
        border-radius:10px;
        text-decoration:none;
        color:#fff;
        background:#212121;
        transition:.3s;
        gap:15px;
    }

    .ebook-item-left{
        display:flex;
        align-items:flex-start;
        gap:12px;
        flex:1;
        min-width:0;
    }

    .ebook-item-left i{
        flex-shrink:0;
        margin-top:4px;
        color:#d4af37;
    }

    .ebook-title{
        flex:1;
        word-break:break-word;
        overflow-wrap:anywhere;
        line-height:1.5;
    }

    .ebook-list a > .fa-chevron-right{
        flex-shrink:0;
        color:#d4af37;
    }

    .ebook-list a:hover{

        background:#caa55a;

        color:#000;

    }

    .tagline {
        letter-spacing: 1.8px;
    }


  @media (max-width: 980px) {
      .photo-grid {
          grid-template-columns: 1fr;
      }
  }
       
    @media (max-width: 800px)
    {
        .ebook-section{
            margin-top:30%;
        }

        .site-nav,
        .header-cta {
            display: block!important;
        }

        .ebook-section{
            margin-left: 0%;
            margin-right: 0%;
        }
    }
  </style>

  <!-- Ebooks script -->
   <script>
        $(document).ready(function(){

            fetch("https://script.google.com/macros/s/AKfycbwCKegmWr6ulrScB3w7uwXiX_CFE_hfqhrl7twROHIhG6bpwvaJtDDzhfpkAYV_833PoA/exec?action=gallery")
            .then(r => r.json())
            .then(data => {
                //console.log(data);
                //console.log(data.length);
                var html = "";
                if(data.length > 0)
                {
                    
                   data.forEach((d) => {
                        html += '<article class="glass-panel">' +
                                    '<img src="' + d.preview + '" alt="' + d.name + '" />' +
                                '</article>';
                    }); 
                    
                    document.getElementById("photo-grid").innerHTML = html;
                } 
            });


    });
   </script>
