   <script>
    const toggle = document.getElementById("shareToggle");

    const menu = document.getElementById("shareMenu");

    toggle.addEventListener("click", () => {

        menu.classList.toggle("show");

    });

    function initShare(){

        const url = encodeURIComponent(window.location.href);

        const text = encodeURIComponent(document.getElementById("blog-title").textContent);  // title

        shareWhatsapp.href =
            `https://wa.me/?text=${text}%20${url}`;

        shareFacebook.href =
            `https://www.facebook.com/sharer/sharer.php?u=${url}`;

        shareLinkedIn.href =
            `https://www.linkedin.com/sharing/share-offsite/?url=${url}`;

        shareX.href =
            `https://twitter.com/intent/tweet?text=${text}&url=${url}`;

        shareInstagram.onclick = () => {

            navigator.clipboard.writeText(window.location.href);

            alert("Blog link copied. Paste it into Instagram Story, Bio, or Direct Message.");

        };

    }
   </script>

  <script>
    document.addEventListener("DOMContentLoaded", LoadContent);

    async function LoadContent()
    {
        let imageURL = "";
        const params = new URLSearchParams(window.location.search);

        const blogId = params.get("id");

        if (!blogId) {

            alert("Blog not found.");

            return;

        }

        const { data, error } = await supabase_var
            .from("blogs")
            .select("*")
            .eq("id", blogId)
            .single();

        if (error) {

            console.log(error);

            return;

        }

        if(data.image)
        {
            imageURL = data.image;
        }
        else{
            imageURL = "../assets/blog-placeholder-1.png"
        }

        document.getElementById("blog-title").textContent = data.title;

        document.getElementById("blog-image").src = imageURL;

        document.getElementById("blog-date").textContent = timeAgo(data.blogdate);

        renderBlog(data.body);
    }
  </script>
  <script>
    function renderBlog(body) {

        const container = document.getElementById("blog-content");

        container.innerHTML = "";

        const blocks = body.replace("\n","\n\n").replace("---","\n\n---\n\n").split(/\n\s*\n/);
        console.log(blocks);
        blocks.forEach(block => {

            block = block.trim();

            if (!block) return;

            // H2
            if (block.startsWith("# ")) {
                const h2 = document.createElement("h2");
                h2.textContent = block.substring(2);
                container.appendChild(h2);
                return;
            }

            if (block.startsWith("#") && !(block.includes("##"))) {

                const h2 = document.createElement("h2");

                h2.textContent = block.replace(/^#\s*/, "");

                container.appendChild(h2);

                return;
            }

            // H3
            if (block.startsWith("## ")) {
                const h3 = document.createElement("h3");
                h3.textContent = block.substring(3);
                container.appendChild(h3);
                return;
            }

            if (block.startsWith("##")) {
                const h3 = document.createElement("h3");
                h3.textContent = block.replace(/^##\s*/, "");
                container.appendChild(h3);
                return;
            }

            // Horizontal Rule
            if (block === "---") {
                container.appendChild(document.createElement("hr"));
                return;
            }

            // Bullet List
            if (block.startsWith("* ")) {

                const ul = document.createElement("ul");

                block.split("\n").forEach(item => {
                    const li = document.createElement("li");
                    li.textContent = item.replace("* ", "");
                    ul.appendChild(li);
                });

                container.appendChild(ul);
                return;
            }

            if (block.startsWith("*")) {

                const ul = document.createElement("ul");

                block.split("\n").forEach(item => {

                    item = item.trim();

                    if (!item) return;

                    const li = document.createElement("li");

                    li.textContent = item.replace(/^\*\s*/, "");

                    ul.appendChild(li);

                });

                container.appendChild(ul);

                return;
            }

            // Paragraph
            const p = document.createElement("p");
            p.textContent = block;
            container.appendChild(p);

        });

    }
  </script>
